apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - postgres.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml

# Pages du design : le nom de la ConfigMap change à chaque modification,
# ce qui redémarre automatiquement le pod
configMapGenerator:
  - name: mywebapp-ui
    namespace: mywebapp
    files:
      - ui/styles.css
      - ui/_common.jspf
      - ui/index.jsp
      - ui/users.jsp
      - ui/success.jsp
      - ui/error.jsp
