apiVersion: v1
kind: ConfigMap
metadata:
  name: mywebapp-config
  namespace: mywebapp
data:
  # Remplace le web.xml du WAR : l'original (DTD 2.3) empêche Tomcat de lire
  # les annotations @WebServlet, donc UserServlet et InsertUserServlet
  # répondraient 404.
  web.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <web-app xmlns="http://xmlns.jcp.org/xml/ns/javaee"
             xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
             xsi:schemaLocation="http://xmlns.jcp.org/xml/ns/javaee http://xmlns.jcp.org/xml/ns/javaee/web-app_4_0.xsd"
             version="4.0" metadata-complete="false">
      <display-name>MyWebApp</display-name>
      <context-param>
        <param-name>dbDriver</param-name>
        <param-value>org.postgresql.Driver</param-value>
      </context-param>
      <context-param>
        <param-name>dbUrl</param-name>
        <param-value>jdbc:postgresql://localhost:5432/mywebapp</param-value>
      </context-param>
      <context-param>
        <param-name>dbUsername</param-name>
        <param-value>userdb</param-value>
      </context-param>
      <context-param>
        <param-name>dbPassword</param-name>
        <param-value>sokh</param-value>
      </context-param>
    </web-app>
