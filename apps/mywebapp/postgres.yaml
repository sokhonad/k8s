# Identifiants imposés par le WAR (codés en dur dans InsertUserServlet)
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: mywebapp
stringData:
  POSTGRES_DB: mywebapp
  POSTGRES_USER: userdb
  POSTGRES_PASSWORD: sokh
---
# Création de la table au premier démarrage de la base
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: mywebapp
data:
  01-users.sql: |
    CREATE TABLE IF NOT EXISTS users (
      id            SERIAL PRIMARY KEY,
      username      VARCHAR(100),
      email         VARCHAR(200),
      city          VARCHAR(100),
      -- texte : le servlet envoie la date avec setString()
      date_of_birth VARCHAR(20)
    );
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: mywebapp
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: mywebapp
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: mywebapp
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
