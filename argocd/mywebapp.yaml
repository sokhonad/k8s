apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mywebapp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sokhonad/k8s.git
    targetRevision: main
    path: apps/mywebapp
  destination:
    server: https://kubernetes.default.svc
    namespace: mywebapp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
